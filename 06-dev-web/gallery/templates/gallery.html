<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <title>Galerie</title>
</head>
<body>

    <header>
        <h1>gallerie d'images</h1>
        <ul>
                        <li>
                <a href="#contact"> Contact</a>
            </li>
            <li>
                <a href="{{ url_for('hello') }}"> Accueil</a>
            </li>

        </ul>
    </header>

    <div class="galerie">
        {% for image in images %}
            <div class="card">
                <img src="{{ url_for('static', filename='images/' + image) }}" alt="{{ image }}">
                <p>{{ histoires[image] }}</p>
            </div>
        {% endfor %}
 
    </div>

 

        <footer id = "contact">
        <h2>Contact</h2>
    </footer>
</body>
</html>
